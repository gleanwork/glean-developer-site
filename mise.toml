[env]
_.file = ".env"

[settings]
python.github_attestations = true

[tools]
# NOTE: updating these versions does *NOT* change what Vercel uses during deploy / preview
# make sure to update `engines` in package.json as well
node = "22.16.0"
pnpm = "10.13.1"
python = "3.13.12"
uv = "0.7"

[tasks."indexing:run"]
description = "Index the docs into Glean (requires GLEAN_INDEXING_API_TOKEN, GLEAN_SERVER_URL; run pnpm build first)"
dir = "scripts/indexing"
run = "uv run glean-idx datasource configure --yes && uv run glean-idx run --yes"

[tasks."indexing:dry-run"]
description = "Run the connector against the local build with Glean mocked (no upload)"
dir = "scripts/indexing"
run = "uv run glean-idx test --phase mock"

[tasks."indexing:test"]
description = "Run the indexing connector unit tests"
dir = "scripts/indexing"
run = "uv run pytest -q"

[tasks."indexing:sync"]
description = "Sync indexing dependencies"
dir = "scripts/indexing"
run = "uv sync"

[tasks."indexing:setup"]
description = "Initial setup: sync deps and install playwright browsers"
dir = "scripts/indexing"
run = """
uv sync
uv run playwright install chromium
"""
