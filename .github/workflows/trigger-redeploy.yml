name: Trigger Redeploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for redeployment (optional)'
        required: false
        default: 'Manual trigger'

  push:
    paths:
      - 'scripts/openapi-capitalize-language.mjs'
      - 'scripts/openapi-split-break-circular.mjs'
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  trigger-redeploy:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-generated.outputs.has_changes }}
      has_semantic_changes: ${{ steps.openapi-diff.outputs.has_semantic_changes }}
      diff_failed: ${{ steps.openapi-diff.outputs.diff_failed }}

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install openapi-changes
        run: npm install --global @pb33f/openapi-changes@0.0.80

      - name: Regenerate OpenAPI documentation
        run: |
          echo "📋 Regenerating OpenAPI documentation..."
          echo "Reason: ${{ github.event.inputs.reason }}"
          pnpm openapi:regenerate:all
          echo "✅ Documentation regenerated successfully"

      - name: Format generated files
        run: >-
          pnpm prettier --write
          openapi
          docs/api
          docs/errors
          src/data/deprecations.json
          src/data/experimental.json
          src/data/platform-errors.json

      - name: Generate OpenAPI delta report
        id: openapi-diff
        env:
          OPENAPI_TRIGGER_REASON: ${{ github.event.inputs.reason }}
        run: pnpm openapi:diff-report --output "$RUNNER_TEMP/openapi-delta.md"

      - name: Check for generated changes
        id: check-generated
        run: |
          # Ignore src/data and static/deprecations because they will both
          # include timestamps that generate false positives to the question:
          # "are there differences to deploy".
          if [[ -n $(git status --porcelain -- ':!src/data/**' ':!static/deprecations.xml') ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected in generated documentation"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ No changes in generated documentation"
          fi

      - name: Create Pull Request
        if: steps.check-generated.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: regenerate OpenAPI documentation'
          title: 'Regenerate OpenAPI Documentation'
          body-path: ${{ runner.temp }}/openapi-delta.md
          branch: ci/regenerate-openapi-docs
          delete-branch: true

      - name: Enable Auto-Merge
        if: >-
          steps.check-generated.outputs.has_changes == 'true' &&
          steps.openapi-diff.outputs.has_semantic_changes == 'false' &&
          steps.openapi-diff.outputs.diff_failed == 'false'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: squash

  summary:
    runs-on: ubuntu-latest
    needs: trigger-redeploy
    steps:
      - name: Print Summary
        run: |
          if [[ "${{ needs.trigger-redeploy.outputs.has_changes }}" != "true" ]]; then
            echo "✅ Documentation is already up to date - no changes needed"
          elif [[ "${{ needs.trigger-redeploy.outputs.diff_failed }}" == "true" ]]; then
            echo "⚠️ Documentation PR created, but semantic diff failed; manual review is required"
          elif [[ "${{ needs.trigger-redeploy.outputs.has_semantic_changes }}" == "true" ]]; then
            echo "🔎 Documentation PR created with API-surface changes; manual review is required"
          else
            echo "🎉 Documentation regenerated and PR created with auto-merge enabled!"
          fi
