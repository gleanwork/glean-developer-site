name: Index Developer Docs
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running (optional)'
        required: false
        default: 'Manual trigger'
      dry_run:
        description: 'Dry run (run the connector against a mocked Glean; nothing is uploaded)'
        required: false
        type: boolean
        default: false
      force_reindex:
        description: 'Force full reindex (calls processalldocuments after upload)'
        required: false
        type: boolean
        default: false
      disable_stale_deletion_check:
        description: 'Bypass 20% stale-deletion safeguard (use for one-off cleanup runs only)'
        required: false
        type: boolean
        default: false
      test_alert:
        description: 'Test the failure alert: fail at the credentials check (nothing is uploaded) and open or update the tracking issue'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run-indexer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Record failed step reads this run's job list
    outputs:
      failed_step: ${{ steps.failed-step.outputs.name }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install site dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Install indexing dependencies
        working-directory: scripts/indexing
        run: uv sync --locked

      # The connector runs through the glean-idx CLI from glean-indexing-sdk,
      # configured by scripts/indexing/glean_deployment.yaml.

      # Runs the real connector end to end against this build with Glean
      # mocked: fetch, transform, batching, and output validation. A broken
      # build fails here, before anything reaches Glean.
      - name: Test connector against the build (mocked Glean)
        working-directory: scripts/indexing
        run: uv run glean-idx test --phase mock --output text

      # Read-only: resolves the server URL and reads the datasource's status,
      # proving the credentials work before anything is uploaded. Runs on dry
      # runs too, so a dry run also verifies the secrets.
      - name: Check Glean credentials
        working-directory: scripts/indexing
        env:
          GLEAN_INDEXING_API_TOKEN: ${{ secrets.GLEAN_INDEXING_API_TOKEN }}
          GLEAN_SERVER_URL: ${{ secrets.GLEAN_SERVER_URL }}
          # Deprecated fallback, used only while GLEAN_SERVER_URL is unset.
          GLEAN_INSTANCE: ${{ secrets.GLEAN_INSTANCE }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          if [ "$TEST_ALERT" = "true" ]; then
            echo "::error::test_alert: failing on purpose to exercise the failure alert"
            exit 1
          fi
          uv run glean-idx doctor --datasource devdocs --output text

      - name: Configure datasource
        if: inputs.dry_run != true
        working-directory: scripts/indexing
        env:
          GLEAN_INDEXING_API_TOKEN: ${{ secrets.GLEAN_INDEXING_API_TOKEN }}
          GLEAN_SERVER_URL: ${{ secrets.GLEAN_SERVER_URL }}
          # Deprecated fallback, used only while GLEAN_SERVER_URL is unset.
          GLEAN_INSTANCE: ${{ secrets.GLEAN_INSTANCE }}
        run: uv run glean-idx datasource configure --yes --output text

      - name: Index documents
        if: inputs.dry_run != true
        working-directory: scripts/indexing
        env:
          GLEAN_INDEXING_API_TOKEN: ${{ secrets.GLEAN_INDEXING_API_TOKEN }}
          GLEAN_SERVER_URL: ${{ secrets.GLEAN_SERVER_URL }}
          # Deprecated fallback, used only while GLEAN_SERVER_URL is unset.
          GLEAN_INSTANCE: ${{ secrets.GLEAN_INSTANCE }}
          DISABLE_STALE_DELETION_CHECK: ${{ inputs.disable_stale_deletion_check }}
        run: |
          args=()
          if [ "$DISABLE_STALE_DELETION_CHECK" = "true" ]; then
            echo "::warning::Stale document deletion safeguard is DISABLED for this run"
            args+=(--disable-stale-deletion-check)
          fi
          uv run glean-idx run --yes --output text "${args[@]}"

      - name: Force reindex
        if: inputs.force_reindex && inputs.dry_run != true
        working-directory: scripts/indexing
        env:
          GLEAN_INDEXING_API_TOKEN: ${{ secrets.GLEAN_INDEXING_API_TOKEN }}
          GLEAN_SERVER_URL: ${{ secrets.GLEAN_SERVER_URL }}
          # Deprecated fallback, used only while GLEAN_SERVER_URL is unset.
          GLEAN_INSTANCE: ${{ secrets.GLEAN_INSTANCE }}
        run: uv run glean-idx datasource process --datasource devdocs --yes --output text

      # Record which step failed so the alert can name it and suggest a cause.
      - name: Record failed step
        id: failed-step
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[] | select(.name == "run-indexer") | .steps[] | select(.conclusion == "failure") | .name][0] // ""')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

  # Scheduled runs only (plus test_alert): a failing nightly opens, or comments
  # on, an issue, and the next successful nightly closes it. Other manual runs
  # never touch the issue.
  alert:
    needs: run-indexer
    if: always() && (github.event_name == 'schedule' || inputs.test_alert)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/indexing/ci

      - name: Report run status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.run-indexer.result }}
          FAILED_STEP: ${{ needs.run-indexer.outputs.failed_step }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/indexing/ci/report-run.sh
