name: CI

on:
  push:
    branches: [main, add-actions-workflows]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck site and workspace packages
        run: pnpm typecheck

      - name: Typecheck selected code snippets
        run: pnpm snippets:typecheck

      - name: Check formatting
        run: pnpm prettier --check .

      - name: Check for incorrect support email
        run: |
          echo "Checking for usage of support@glean.com..."
          if grep -r --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=build --exclude-dir=dist --exclude-dir=.next --exclude="*.lock" --exclude="pnpm-lock.yaml" --exclude="ci.yml" "support@glean.com" .; then
            echo "Found usage of incorrect email 'support@glean.com'"
            echo "Please replace with the correct support email address"
            exit 1
          else
            echo "No usage of support@glean.com found"
          fi

      - name: Check API sidebar completeness
        run: pnpm sidebar:check

      - name: Check code snippets are in sync
        run: pnpm snippets:check

      # Recipe metadata is authored in gleanwork/glean-cookbook. The two files
      # here are generated from it, and four separate PRs added recipes by editing
      # them directly — which builds, renders, and is then deleted by the next
      # sync. Fail at the door rather than a week later. The head ref lets the
      # same check reject a correctly generated sync carried by hand, which the
      # scheduled workflow would have produced anyway.
      - name: Generated recipe data not hand-edited
        run: node scripts/check-generated-recipe-data.mjs origin/${{ github.base_ref || 'main' }} ${{ github.head_ref }}

      - name: Run tests
        run: pnpm test

      - name: Build website
        run: pnpm build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

  indexing:
    name: Indexing Connector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/indexing
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install indexing dependencies
        run: uv sync --locked

      # Fixture-based: no site build or Glean credentials needed. The
      # end-to-end check against real build output (glean-idx test --phase
      # mock) runs in the Index Developer Docs workflow after `pnpm build`.
      - name: Run connector tests
        run: uv run pytest -q
