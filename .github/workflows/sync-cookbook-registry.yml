name: Sync Cookbook Registry

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for syncing (optional)'
        required: false
        default: 'Manual trigger'

  push:
    paths:
      - 'scripts/sync-registry.mjs'
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-registry:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-generated.outputs.has_changes }}

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # gleanwork-ci is installed on both repos (confirmed 2026-07-25).
          owner: gleanwork
          repositories: glean-cookbook,glean-developer-site

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync registry.json from glean-cookbook
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "📋 Syncing recipe registry..."
          echo "Reason: ${{ github.event.inputs.reason }}"
          pnpm registry:sync
          pnpm recipes:compile
          echo "✅ Registry synced and recipes recompiled"

      - name: Format generated files
        run: pnpm prettier --write .

      - name: Check for generated changes
        id: check-generated
        run: |
          # Ignore src/data because it will include a generatedAt timestamp
          # that generates a false positive to the question: "are there
          # differences to deploy" — the real signal is data/*.json.
          if [[ -n $(git status --porcelain -- ':!src/data/**') ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected in the recipe registry"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ Registry is already up to date"
          fi

      - name: Create Pull Request
        if: steps.check-generated.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: sync cookbook recipe registry'
          title: 'Sync cookbook recipe registry'
          body: |
            ## 🔄 Cookbook Registry Sync

            **Trigger reason**: ${{ github.event.inputs.reason }}
            **Triggered by**: ${{ github.actor }}
            **Run ID**: [${{ github.run_id }}](https://github.com/gleanwork/glean-developer-site/actions/runs/${{ github.run_id }})

            ### Actions taken:
            - Fetched the latest `registry.json` from gleanwork/glean-cookbook
            - Recompiled `src/data/recipes.json`

            ### Files affected:
            - `data/cookbook-registry.json` - Updated recipe metadata snapshot
            - `src/data/recipes.json` - Recompiled recipe records

            Please review the changes if needed, otherwise the PR will auto-merge when checks pass.
          branch: ci/sync-cookbook-registry
          delete-branch: true

      - name: Enable Auto-Merge
        if: steps.check-generated.outputs.has_changes == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: squash

  summary:
    runs-on: ubuntu-latest
    needs: sync-registry
    steps:
      - name: Print Summary
        run: |
          if [[ "${{ needs.sync-registry.outputs.has_changes }}" == "true" ]]; then
            echo "🎉 Registry synced and PR created with auto-merge enabled!"
          else
            echo "✅ Registry is already up to date - no changes needed"
          fi
