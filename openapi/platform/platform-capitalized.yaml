    PlatformAgentRunApprovalDecision:
      type: object
      additionalProperties: false
      description: Approve or reject the invocation identified by a pending interaction ID.
      required:
        - interaction_id
        - decision
      properties:
        interaction_id:
          type: string
          minLength: 1
          maxLength: 256
          description: The interaction_id returned in the run's pending_interactions.
        decision:
          type: string
          enum:
            - APPROVE
            - REJECT
          description: The decision for this invocation only. Rejection follows normal workflow behavior.
    PlatformAgentRunResponsesRequest:
      type: object
      additionalProperties: false
      description: Invocation-scoped decisions for the complete pending approval batch.
      required:
        - run_id
        - responses
      example:
        run_id: '{run_id}'
        responses:
          - interaction_id: '{interaction_id}'
            decision: APPROVE
      properties:
        run_id:
          type: string
          minLength: 1
          maxLength: 256
          description: ID of the run whose pending approvals are being answered. Must belong to the agent identified in the path.
        responses:
          type: array
          minItems: 1
          maxItems: 100
          description: One decision per pending interaction. Interaction IDs must be unique.
          items:
            $ref: '#/components/schemas/PlatformAgentRunApprovalDecision'
    PlatformChatInputMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - USER
            - ASSISTANT
        content:
          type: string
          minLength: 1
    PlatformChatTextFormat:
      type: object
      additionalProperties: false
      description: Unconstrained plain-text assistant output.
      required:
        - type
      properties:
        type:
          type: string
          description: Discriminator. Must be TEXT.
          enum:
            - TEXT
    PlatformChatJsonSchemaFormat:
      type: object
      additionalProperties: false
      description: Constrains the assistant response to a caller-supplied JSON Schema.
      required:
        - type
        - name
        - schema
      properties:
        type:
          type: string
          description: Discriminator. Must be JSON_SCHEMA.
          enum:
            - JSON_SCHEMA
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: A stable identifier for the schema.
        description:
          type: string
          maxLength: 1024
          description: An optional human-readable description of the schema.
        schema:
          type: object
          additionalProperties: true
          description: A JSON Schema object describing the desired output shape.
        strict:
          type: boolean
          default: true
          description: |
            When true, the provider validates the response against the schema. Unsupported by some providers; defaults to true.
    PlatformChatCreateRequest:
      type: object
      additionalProperties: false
      required:
        - input
      example:
        input: Summarize our parental leave policy as JSON.
        text:
          format:
            type: JSON_SCHEMA
            name: policy_summary
            schema:
              type: object
              properties:
                eligible_employees:
                  type: string
                duration_weeks:
                  type: integer
              required:
                - eligible_employees
                - duration_weeks
            strict: true
      properties:
        input:
          description: |
            Either a plain string (single user turn) or a chronological array of `USER`/`ASSISTANT` messages. The final array message must be `USER`.
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PlatformChatInputMessage'
        stream:
          type: boolean
          description: |
            When true, the HTTP response is `text/event-stream`. When false or omitted, the HTTP response is `application/json`.
          default: false
        store:
          type: boolean
          description: |
            When true (default), persist the interaction and return a `conversation_id`. When false, run ephemerally with no persistence.
          default: true
        conversation_id:
          type: string
          minLength: 1
          description: |
            Continue an existing stored conversation. Incompatible with message-array `input` and with `store: false`.
        text:
          type: object
          additionalProperties: false
          description: |
            Optional configuration for the assistant's text response. When `format.type` is `JSON_SCHEMA`, the response is constrained to the supplied JSON schema and returned in `output[*].content[*].structured_output`. Structured output is not supported when `stream` is true.
          properties:
            format:
              description: |
                Output format for the assistant text. TEXT is unconstrained. JSON_SCHEMA constrains the response to the supplied schema.
              oneOf:
                - $ref: '#/components/schemas/PlatformChatTextFormat'
                - $ref: '#/components/schemas/PlatformChatJsonSchemaFormat'
    PlatformChatStreamResponseId:
      type: string
      minLength: 1
      pattern: ^resp_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: |
        Platform-owned, non-persisted response envelope identifier in `resp_<uuid>` form. The same identifier is used for every event in one streamed response.
    PlatformChatOutputTextContent:
      type: object
      additionalProperties: false
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - OUTPUT_TEXT
        text:
          type: string
        structured_output:
          type:
            - object
            - 'null'
          description: |
            Parsed and validated JSON object when structured output was requested. Present only when the request included `text.format.type: JSON_SCHEMA`.
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/PlatformChatCitationAnnotation'
    PlatformChatOutputMessage:
      type: object
      additionalProperties: false
      required:
        - type
        - role
        - content
      properties:
        type:
          type: string
          enum:
            - MESSAGE
        role:
          type: string
          enum:
            - ASSISTANT
        content:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PlatformChatOutputTextContent'
    PlatformChatCompletedResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - created_at
        - status
        - output
        - store
        - request_id
      properties:
        id:
          $ref: '#/components/schemas/PlatformChatStreamResponseId'
        object:
          type: string
          enum:
            - RESPONSE
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp when the response was created.
        status:
          type: string
          enum:
            - COMPLETED
        output:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PlatformChatOutputMessage'
        store:
          type: boolean
        conversation_id:
          type:
            - string
            - 'null'
          minLength: 1
          description: Present when the interaction was persisted.
        request_id:
          type: string
          minLength: 1
    PlatformChatStreamResponseCreated:
      type: object
      additionalProperties: false
      required:
        - type
        - response_id
      properties:
        type:
          type: string
          enum:
            - RESPONSE_CREATED
        response_id:
          $ref: '#/components/schemas/PlatformChatStreamResponseId'
    PlatformChatStreamProgress:
      type: object
      additionalProperties: false
      required:
        - type
        - response_id
        - text
      properties:
        type:
          type: string
          enum:
            - RESPONSE_PROGRESS
        response_id:
          $ref: '#/components/schemas/PlatformChatStreamResponseId'
        text:
          type: string
          minLength: 1
          description: |
            Verbatim concatenated fragment text from an assistant UPDATE wire message. Display-oriented passthrough only; not part of the final answer and not present on terminal response snapshots.
    PlatformChatStreamOutputTextDelta:
      type: object
      additionalProperties: false
      required:
        - type
        - response_id
        - delta
      properties:
        type:
          type: string
          enum:
            - RESPONSE_OUTPUT_TEXT_DELTA
        response_id:
          $ref: '#/components/schemas/PlatformChatStreamResponseId'
        delta:
          type: string
    PlatformChatStreamOutputTextDone:
      type: object
      additionalProperties: false
      required:
        - type
        - response_id
        - text
      properties:
        type:
          type: string
          enum:
            - RESPONSE_OUTPUT_TEXT_DONE
        response_id:
          $ref: '#/components/schemas/PlatformChatStreamResponseId'
        text:
          type: string
    PlatformChatStreamResponseCompleted:
      type: object
      additionalProperties: false
      required:
        - type
        - response_id
        - response
      properties:
        type:
          type: string
          enum:
            - RESPONSE_COMPLETED
        response_id:
          $ref: '#/components/schemas/PlatformChatStreamResponseId'
        response:
          $ref: '#/components/schemas/PlatformChatCompletedResponse'
    PlatformChatResponseError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        code:
          type:
            - string
            - 'null'
          description: |
            Open snake_case error code aligned with ProblemDetail codes when present. Clients must tolerate unknown values; the set of codes is not a closed enum. Limit failures use `spend_limit_exceeded` (billing spend limit) and `token_limit_exceeded` (model context/token limit).
          example: spend_limit_exceeded
        message:
          type: string
          minLength: 1
    PlatformChatFailedResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - created_at
        - status
        - output
        - store
        - request_id
        - error
      properties:
        id:
          $ref: '#/components/schemas/PlatformChatStreamResponseId'
        object:
          type: string
          enum:
            - RESPONSE
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp when the response was created.
        status:
          type: string
          enum:
            - FAILED
        output:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/PlatformChatOutputMessage'
        store:
          type: boolean
        conversation_id:
          type:
            - string
            - 'null'
          minLength: 1
          description: Present when the interaction was persisted.
        request_id:
          type: string
          minLength: 1
        error:
          $ref: '#/components/schemas/PlatformChatResponseError'
    PlatformChatStreamResponseFailed:
      type: object
      additionalProperties: false
      required:
        - type
        - response_id
        - response
      properties:
        type:
          type: string
          enum:
            - RESPONSE_FAILED
        response_id:
          $ref: '#/components/schemas/PlatformChatStreamResponseId'
        response:
          $ref: '#/components/schemas/PlatformChatFailedResponse'
    PlatformChatStreamEvent:
      description: |
        JSON object written to the SSE `data` field. This schema is the payload for SDK transform, not the raw HTTP body. Do not run JSON response conformance on stream bodies. A typical wire frame is:
        id: 1
        event: RESPONSE_CREATED
        data: {"type":"RESPONSE_CREATED","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015"}
      example:
        type: RESPONSE_CREATED
        response_id: resp_e65a0a77-97a2-4c91-be60-eae7f6238015
      oneOf:
        - $ref: '#/components/schemas/PlatformChatStreamResponseCreated'
        - $ref: '#/components/schemas/PlatformChatStreamProgress'
        - $ref: '#/components/schemas/PlatformChatStreamOutputTextDelta'
        - $ref: '#/components/schemas/PlatformChatStreamOutputTextDone'
        - $ref: '#/components/schemas/PlatformChatStreamResponseCompleted'
        - $ref: '#/components/schemas/PlatformChatStreamResponseFailed'
      discriminator:
        propertyName: type
        mapping:
          RESPONSE_CREATED: '#/components/schemas/PlatformChatStreamResponseCreated'
          RESPONSE_PROGRESS: '#/components/schemas/PlatformChatStreamProgress'
          RESPONSE_OUTPUT_TEXT_DELTA: '#/components/schemas/PlatformChatStreamOutputTextDelta'
          RESPONSE_OUTPUT_TEXT_DONE: '#/components/schemas/PlatformChatStreamOutputTextDone'
          RESPONSE_COMPLETED: '#/components/schemas/PlatformChatStreamResponseCompleted'
          RESPONSE_FAILED: '#/components/schemas/PlatformChatStreamResponseFailed'
    PlatformSkillStatus:
      type: string
      enum:
        - DRAFT
        - ENABLED
        - DISABLED
      description: |
        The caller's effective activation. The owner sees the skill's stored status. Another caller sees their personal setting, or DISABLED when they have none. DRAFT is the stored draft state and is not set by update. Effective activation may also reflect workspace governance policy.
    PlatformSkillOrigin:
      type: string
      enum:
        - CUSTOM
        - GITHUB
      description: Source category for the skill.
    PlatformSkillSyncStatus:
      type: string
      enum:
        - UP_TO_DATE
        - UPDATE_AVAILABLE
        - SYNC_FAILED
      description: Current external-source sync status.
    PlatformSkillSourceProvenance:
      type: object
      properties:
        source_url:
          type: string
          description: URL of the external source the skill was imported from.
        commit_sha:
          type: string
          description: Source commit SHA for the imported skill.
        imported_at:
          type: string
          format: date-time
          description: Time the skill was imported.
        last_synced_at:
          type: string
          format: date-time
          description: Time the skill was last synced from its source.
        sync_status:
          $ref: '#/components/schemas/PlatformSkillSyncStatus'
        sync_error:
          type: string
          description: Human-readable sync failure reason, present only when sync_status is SYNC_FAILED.
    PlatformPersonReference:
      type: object
      description: A lightweight reference to a person, used where a payload merely points at someone.
      required:
        - name
      properties:
        id:
          type: string
          description: Opaque Glean person ID.
        name:
          type: string
          description: Display name.
    PlatformSkill:
      type: object
      required:
        - skill_id
        - display_name
        - description
        - latest_version
        - latest_minor_version
        - status
        - origin
        - owner
        - created_at
        - updated_at
      properties:
        skill_id:
          type: string
          description: Glean skill ID.
        display_name:
          type: string
          description: Human-readable skill name.
        description:
          type: string
          description: Human-readable skill description.
        latest_version:
          type: integer
          description: Latest major version number for the skill.
        latest_minor_version:
          type: integer
          description: Latest minor version number for the skill.
        status:
          $ref: '#/components/schemas/PlatformSkillStatus'
        origin:
          $ref: '#/components/schemas/PlatformSkillOrigin'
        source_provenance:
          $ref: '#/components/schemas/PlatformSkillSourceProvenance'
        owner:
          $ref: '#/components/schemas/PlatformPersonReference'
        created_at:
          type: string
          format: date-time
          description: Time the skill was created.
        updated_at:
          type: string
          format: date-time
          description: Time the skill was last updated.
    PlatformSkillsListResponse:
      type: object
      required:
        - results
        - has_more
        - next_cursor
        - request_id
      properties:
        results:
          type: array
          description: Skills available to the user.
          items:
            $ref: '#/components/schemas/PlatformSkill'
        has_more:
          type: boolean
          description: Whether additional results are available.
        next_cursor:
          type:
            - string
            - 'null'
          description: Cursor for the next page, or null when no more results are available.
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformSkillCreateRequest:
      type: object
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: SKILL.md, .zip, or .skill bundle to create.
    PlatformSkillCreateResponse:
      type: object
      required:
        - skill
        - request_id
      properties:
        skill:
          $ref: '#/components/schemas/PlatformSkill'
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformSkillImportRequest:
      type: object
      additionalProperties: false
      required:
        - source_urls
      example:
        source_urls:
          - https://github.com/anthropics/skills/tree/main/skills/skill-creator
      properties:
        source_urls:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Resolved GitHub skill URLs selected from a source preview.
          items:
            type: string
            minLength: 1
            maxLength: 2048
    PlatformSkillImportResponse:
      type: object
      required:
        - skills
        - request_id
      properties:
        skills:
          type: array
          minItems: 1
          description: |
            Imported skills in request order. The import is atomic: either every source persists or none does.
          items:
            $ref: '#/components/schemas/PlatformSkill'
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformSkillValidationRequest:
      type: object
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: SKILL.md, .zip, or .skill bundle to validate.
    PlatformSkillValidationMetadata:
      type: object
      required:
        - display_name
        - description
      properties:
        display_name:
          type: string
          description: Skill name parsed from SKILL.md frontmatter.
        description:
          type: string
          description: Skill description parsed from SKILL.md frontmatter.
    PlatformSkillValidationFile:
      type: object
      required:
        - path
        - size_bytes
        - is_manifest
      properties:
        path:
          type: string
          description: Normalized relative path in the skill bundle.
        size_bytes:
          type: integer
          description: File size in bytes.
        is_manifest:
          type: boolean
          description: Whether this file is the skill manifest.
    PlatformSkillValidationResponse:
      type: object
      required:
        - metadata
        - files
        - warnings
        - request_id
      properties:
        metadata:
          $ref: '#/components/schemas/PlatformSkillValidationMetadata'
        files:
          type: array
          description: Normalized files in the bundle after stripping an optional single root folder.
          items:
            $ref: '#/components/schemas/PlatformSkillValidationFile'
        warnings:
          type: array
          description: Non-blocking validation warnings.
          items:
            $ref: '#/components/schemas/PlatformWarning'
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformSkillSourcePreviewRequest:
      type: object
      additionalProperties: false
      required:
        - source_url
      example:
        source_url: https://github.com/anthropics/skills
      properties:
        source_url:
          type: string
          minLength: 1
          maxLength: 2048
          description: GitHub URL for a skill directory, SKILL.md file, or repository to inspect.
        stream:
          type: boolean
          default: false
          description: Whether to stream repository scan progress using server-sent events.
    PlatformSkillSourcePreviewFile:
      type: object
      required:
        - path
        - content
      properties:
        path:
          type: string
          description: Relative path within the skill bundle.
        content:
          type: string
          description: UTF-8 file content.
    PlatformSkillSourcePreview:
      type: object
      required:
        - display_name
        - description
        - source_url
        - commit_sha
        - main_content
        - files
        - file_tree
      properties:
        display_name:
          type: string
          description: Skill name parsed from SKILL.md frontmatter.
        description:
          type: string
          description: Skill description parsed from SKILL.md frontmatter.
        source_url:
          type: string
          description: Resolved URL for this skill within the source.
        commit_sha:
          type: string
          description: Commit SHA used to produce the preview.
        main_content:
          type: string
          description: SKILL.md content fetched as part of the preview.
        files:
          type: array
          description: Supporting files fetched with the skill.
          items:
            $ref: '#/components/schemas/PlatformSkillSourcePreviewFile'
        file_tree:
          type: array
          description: Relative paths discovered for the skill.
          items:
            type: string
    PlatformSkillSourcePreviewFailureCode:
      type: string
      enum:
        - INVALID_SKILL
        - SKILL_FETCH_FAILED
      description: Stable machine-readable reason a discovered entry was excluded.
    PlatformSkillSourcePreviewFailure:
      type: object
      required:
        - source_url
        - code
        - detail
      properties:
        source_url:
          type: string
          description: Resolved URL for the entry that could not be previewed.
        code:
          $ref: '#/components/schemas/PlatformSkillSourcePreviewFailureCode'
        detail:
          type: string
          description: Safe explanation of why the entry was excluded.
    PlatformSkillSourcePreviewResponse:
      type: object
      required:
        - skills
        - failures
        - request_id
      properties:
        skills:
          type: array
          minItems: 1
          description: Valid skills discovered at the source URL.
          items:
            $ref: '#/components/schemas/PlatformSkillSourcePreview'
        failures:
          type: array
          description: Discovered entries that could not be included in the preview.
          items:
            $ref: '#/components/schemas/PlatformSkillSourcePreviewFailure'
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformSkillSourcePreviewStreamScan:
      type: object
      additionalProperties: false
      description: Repository scan started; names every skill path found.
      required:
        - type
        - total
        - skill_paths
      properties:
        type:
          type: string
          enum:
            - SCAN
          description: Event type, also sent as the SSE `event` name.
        total:
          type: integer
          minimum: 0
          description: Number of skill paths found in the scan.
        skill_paths:
          type: array
          description: Skill paths found in the scan.
          items:
            type: string
            description: One skill path found in the scan.
    PlatformSkillSourcePreviewStreamProgress:
      type: object
      additionalProperties: false
      description: One skill finished inspecting; names the skill in progress.
      required:
        - type
        - completed
        - total
        - current_skill
      properties:
        type:
          type: string
          enum:
            - PROGRESS
          description: Event type, also sent as the SSE `event` name.
        completed:
          type: integer
          minimum: 0
          description: Number of skills inspected so far.
        total:
          type: integer
          minimum: 0
          description: Number of skills to inspect.
        current_skill:
          type: string
          description: Path of the skill being inspected.
    PlatformSkillSourcePreviewStreamSkill:
      type: object
      additionalProperties: false
      description: One skill previewed; carries the previewed skill.
      required:
        - type
        - skill
      properties:
        type:
          type: string
          enum:
            - SKILL
          description: Event type, also sent as the SSE `event` name.
        skill:
          $ref: '#/components/schemas/PlatformSkillSourcePreview'
          description: The previewed skill.
    PlatformSkillSourcePreviewStreamResult:
      type: object
      additionalProperties: false
      description: Terminal success event carrying the fully assembled preview.
      required:
        - type
        - response
      properties:
        type:
          type: string
          enum:
            - RESULT
          description: Event type, also sent as the SSE `event` name.
        response:
          $ref: '#/components/schemas/PlatformSkillSourcePreviewResponse'
          description: The fully assembled preview response.
    PlatformSkillSourcePreviewStreamError:
      type: object
      additionalProperties: false
      description: Terminal failure event carrying the failure as a problem detail. Most GitHub authorization failures return HTTP 422 before the stream opens. If authorization fails after the stream opens, `error.code` is `tools_unauthorized` and `authentication_suggestions` is present.
      required:
        - type
        - error
      properties:
        type:
          type: string
          enum:
            - ERROR
          description: Event type, also sent as the SSE `event` name.
        error:
          $ref: '#/components/schemas/PlatformProblemDetail'
          description: The failure as a problem detail.
        authentication_suggestions:
          type: array
          minItems: 1
          description: Present only when `error.code` is `tools_unauthorized`. Names the GitHub action pack to authorize, with the same retry flow as the 422 response.
          items:
            $ref: '#/components/schemas/PlatformAuthenticationSuggestion'
    PlatformSkillSourcePreviewStreamEvent:
      description: |
        JSON object written to the SSE `data` field of a streaming source preview. This schema is the payload for SDK transform, not the raw HTTP body. Do not run JSON response conformance on stream bodies. Each frame also carries an `event` name matching the payload `type`. The stream ends with the RESULT event on success or the ERROR event on failure. A typical wire frame is:
        event: SCAN
        data: {"type":"SCAN","total":1,"skill_paths":["https://github.com/acme/skills/tree/main/skills/example"]}
      example:
        type: SCAN
        total: 1
        skill_paths:
          - https://github.com/acme/skills/tree/main/skills/example
      oneOf:
        - $ref: '#/components/schemas/PlatformSkillSourcePreviewStreamScan'
        - $ref: '#/components/schemas/PlatformSkillSourcePreviewStreamProgress'
        - $ref: '#/components/schemas/PlatformSkillSourcePreviewStreamSkill'
        - $ref: '#/components/schemas/PlatformSkillSourcePreviewStreamResult'
        - $ref: '#/components/schemas/PlatformSkillSourcePreviewStreamError'
      discriminator:
        propertyName: type
        mapping:
          SCAN: '#/components/schemas/PlatformSkillSourcePreviewStreamScan'
          PROGRESS: '#/components/schemas/PlatformSkillSourcePreviewStreamProgress'
          SKILL: '#/components/schemas/PlatformSkillSourcePreviewStreamSkill'
          RESULT: '#/components/schemas/PlatformSkillSourcePreviewStreamResult'
          ERROR: '#/components/schemas/PlatformSkillSourcePreviewStreamError'
    PlatformSkillGetResponse:
      type: object
      required:
        - skill
        - request_id
      properties:
        skill:
          $ref: '#/components/schemas/PlatformSkill'
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformSkillUpdateStatus:
      type: string
      enum:
        - ENABLED
        - DISABLED
      description: |
        Activation to apply for the authenticated caller. For the owner, this updates the skill's stored status. For any other caller, it updates only that caller's setting.
    PlatformSkillUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - status
      example:
        status: ENABLED
      properties:
        status:
          $ref: '#/components/schemas/PlatformSkillUpdateStatus'
    PlatformSkillUpdateResponse:
      type: object
      required:
        - skill
        - request_id
      properties:
        skill:
          $ref: '#/components/schemas/PlatformSkill'
        request_id:
          type: string
          description: Platform-generated request ID for support correlation.
    PlatformSkillSyncResponse:
      type: object
      required:
        - commit_sha
        - is_updated
        - request_id
      properties:
        commit_sha:
          type: string
          minLength: 1
          description: Git commit SHA now associated with the skill.
