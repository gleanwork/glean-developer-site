    PlatformFilterOperator:
      type: string
      description: Supported filter operator.
      enum:
        - EQUALS
        - NOT_EQUALS
        - GT
        - GTE
        - LT
        - LTE
    PlatformFilter:
      type: object
      additionalProperties: false
      required:
        - field
        - values
      description: |
        A single filter criterion. For `EQUALS`, multiple values within a filter are OR'd; for `NOT_EQUALS`, listed values are excluded. Separate filters are AND'd with each other and with inline operators in `query`. Repeated same-field `EQUALS` filters are rejected.
      properties:
        field:
          type: string
          minLength: 1
          description: |
            Filter field name. Built-in names (case-sensitive, lowercase only): `type`, `owner`, `from`, `author`, `channel`, `status`, `assignee`, `reporter`, `component`, `mentions`, and `collection`. Built-ins accept only `EQUALS` and `NOT_EQUALS`. Any other nonblank name is accepted as a custom filter without spelling, existence, or type checks; behavior depends on your connected sources.
          example: type
        values:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: |
            One or more values to match. Prefer values returned by filter discovery unchanged. For people (`USER`) fields, values may be email addresses or display names.
          example:
            - spreadsheet
            - presentation
        operator:
          allOf:
            - $ref: '#/components/schemas/PlatformFilterOperator'
          description: |
            Comparison operator. Defaults to `EQUALS`. Built-in fields support only `EQUALS` and `NOT_EQUALS`. Range operators (`GT`, `GTE`, `LT`, `LTE`) require exactly one value; express ranges with multiple filters on the same field. Custom fields may support different operators depending on the data source.
    PlatformTimeRange:
      type: object
      additionalProperties: false
      description: Filter results to those last updated within this range.
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive lower bound in ISO 8601 format.
        end:
          type: string
          format: date-time
          description: Exclusive upper bound in ISO 8601 format.
    PlatformSearchRequest:
      type: object
      additionalProperties: false
      required:
        - query
      example:
        query: quarterly planning 2026
        datasources:
          - confluence
          - google_drive
        filters:
          - field: type
            values:
              - spreadsheet
              - presentation
      properties:
        query:
          type: string
          minLength: 1
          description: |
            The search query string. Supports inline operators such as `from:jane type:document app:confluence`. Inline operators are AND'd with structured `filters`.
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Number of results to return per page.
        cursor:
          type: string
          nullable: true
          description: |
            Opaque pagination token from a previous response's `next_cursor` field. Omit on the first request.
          example: ''
        datasources:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: |
            Restrict results to specific datasource identifiers returned by `GET /api/search/filters`. Scopes by datasource type and may include results from multiple instances of that type.
        filters:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlatformFilter'
          description: |
            Structured filters applied to search results. Multiple values within a filter with `EQUALS` are OR'd; separate filters are AND'd. Conflicting constraints on the same field (for example, `type:document` in `query` and `type:spreadsheet` in a filter) return an empty result set. See `Filter.field` for built-in field names and operators. Other nonblank field names are accepted as custom filters without validation; behavior depends on your connected sources.
        time_range:
          $ref: '#/components/schemas/PlatformTimeRange'
    PlatformResult:
      type: object
      additionalProperties: false
      required:
        - url
        - title
        - datasource
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          description: Canonical URL of the result.
          example: https://company.atlassian.net/wiki/spaces/ENG/pages/12345
        title:
          type: string
          minLength: 1
          description: Result title.
          example: Q2 2026 Platform Roadmap
        snippets:
          type: array
          items:
            type: string
            minLength: 1
          description: Query-relevant plain-text excerpts from the result body.
          example:
            - The platform team will focus on API stability and...
        datasource:
          type: string
          minLength: 1
          description: The datasource this result originates from.
          example: confluence
        document_type:
          type: string
          nullable: true
          minLength: 1
          description: The document type within the datasource.
          example: page
        creator:
          $ref: '#/components/schemas/PlatformPersonReference'
        owner:
          $ref: '#/components/schemas/PlatformPersonReference'
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: When the result was last modified.
        created_at:
          type: string
          format: date-time
          nullable: true
          description: When the result was created.
    PlatformSearchResponse:
      type: object
      additionalProperties: false
      required:
        - results
        - has_more
        - next_cursor
        - request_id
        - warnings
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PlatformResult'
          description: |
            Ordered list of ranked document results. People cards, Q&A blocks, and other UI-only result types are not included.
        has_more:
          type: boolean
          description: Indicates whether additional pages of results are available.
        next_cursor:
          type: string
          nullable: true
          description: Opaque token to pass as `cursor` in the next request.
        request_id:
          type: string
          minLength: 1
          description: Platform-generated request ID for support correlation.
        warnings:
          type: array
          description: |
            Non-blocking warnings for this response. Required; use `[]` when there are none. Clients must tolerate unknown warning codes. `results_incomplete` means some results may be unavailable for the requested datasource scope while `results`, `has_more`, and `next_cursor` remain present. Warning messages are generic and do not include query text or internal identifiers.
          items:
            $ref: '#/components/schemas/PlatformWarning'
    PlatformFilterFieldInfo:
      type: object
      additionalProperties: false
      required:
        - field
        - type
        - operators
      properties:
        field:
          type: string
          minLength: 1
          description: Field name usable in the `filters` array for `POST /api/search`.
          example: status
        type:
          type: string
          minLength: 1
          description: |
            Open field-type string. Current values are `STRING` for text and keyword fields and `USER` for people fields (`owner`, `from`, `author`, `assignee`, `reporter`, `mentions`). Clients must tolerate unknown values.
          example: STRING
        operators:
          type: array
          minItems: 1
          description: |
            Comparison operators supported for this field. Built-in fields expose `EQUALS` and `NOT_EQUALS`.
          items:
            $ref: '#/components/schemas/PlatformFilterOperator'
        values:
          type: array
          description: |
            Suggested filter values observed for the supplied `query`. Omitted in catalog-only responses. Present as an array, including `[]`, when `query` is provided. Values are a bounded, non-exhaustive sample in search-provider order and may include duplicates; blank values are omitted. No additional endpoint-specific truncation is applied. Grouping in the search UI is not preserved; each value applies to the field broadly. An empty array does not mean no valid value exists. Availability varies by data source; federated and MCP integrations may return page-derived values or none at all. Reusing a suggested value in `POST /api/search` does not guarantee matching results or identical filter behavior. For `USER` fields, values may be email addresses or display names.
          items:
            type: string
            minLength: 1
    PlatformDatasourceFilterInfo:
      type: object
      additionalProperties: false
      required:
        - datasource
        - filters
      properties:
        datasource:
          type: string
          minLength: 1
          description: |
            Datasource identifier usable in `POST /api/search` `datasources`.
          example: jira
        filters:
          type: array
          description: |
            Common built-in filter fields for this datasource. May be empty. A built-in omitted here can still be valid in `POST /api/search`; see `Filter.field` for the full built-in name list.
          items:
            $ref: '#/components/schemas/PlatformFilterFieldInfo'
    PlatformSearchFiltersResponse:
      type: object
      additionalProperties: false
      required:
        - datasources
        - request_id
      properties:
        datasources:
          type: array
          description: |
            Datasources visible to the authenticated user. Each `datasource` is an identifier you can pass to `POST /api/search` `datasources`. An empty array means no visible datasources.
          items:
            $ref: '#/components/schemas/PlatformDatasourceFilterInfo'
        request_id:
          type: string
          minLength: 1
          description: Platform-generated request ID for support correlation.
