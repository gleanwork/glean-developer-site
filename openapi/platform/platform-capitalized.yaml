  /api/agents/{agent_id}/runs:
    post:
      tags:
        - Agents
      summary: Create agent run
      description: |
        Execute an agent run. Set `stream` to true to receive server-sent events; otherwise the response contains the final agent messages.
      operationId: platform-agents-create-run
      x-visibility: Public
      x-codegen-request-body-name: payload
      parameters:
        - in: path
          name: agent_id
          description: ID of the agent to run.
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAgentRunCreateRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAgentRunWaitResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent events emitted by the running agent. Successful runs emit `message` events. A terminal failure after the stream has started emits exactly one `run.failed` event whose `data` is an `AgentRunFailedEventData` payload, then closes.
                example: |
                  id: 1
                  event: message
                  data: {"messages":[{"role":"GLEAN_AI","content":[{"text":"Hello","type":"text"}]}]}

                  id: 2
                  event: message
                  data: {"messages":[{"role":"GLEAN_AI","content":[{"text":", I can help with HR policy questions.","type":"text"}]}]}

                  id: 3
                  event: run.failed
                  data: {"error":{"type":"https://developers.glean.com/errors/spend-limit-exceeded","title":"Spend Limit Exceeded","status":403,"detail":"You've reached the monthly limit set by your admin.","code":"spend_limit_exceeded","request_id":"req_123","documentation_url":"https://developers.glean.com/errors/spend-limit-exceeded"}}
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformUnauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '408':
          $ref: '#/components/responses/PlatformRequestTimeout'
        '409':
          $ref: '#/components/responses/PlatformConflict'
        '413':
          $ref: '#/components/responses/PlatformRequestTooLarge'
        '422':
          description: Returned when the agent has tools the caller must authorize before the run can start. `authentication_suggestions` names each such tool; POST its `server_id` to the Client API's `/tool-servers/{serverId}/auth` with `returnUrl` in the request body to obtain an `authorizationUrl` to redirect the end user to, then retry the run once OAuth completes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PlatformUnauthorizedAgentToolsProblem'
        '429':
          $ref: '#/components/responses/PlatformTooManyRequests'
        '500':
          $ref: '#/components/responses/PlatformInternalServerError'
        '503':
          $ref: '#/components/responses/PlatformServiceUnavailable'
      x-speakeasy-group: agents
      x-speakeasy-name-override: createRun
      x-codeSamples:
        - lang: Python
          label: Python (API Client)
          source: |-
            from glean.api_client import Glean, models
            import os


            with Glean(
                api_token=os.getenv("GLEAN_API_TOKEN", ""),
                server_url="https://mycompany-be.glean.com",
            ) as glean:

                res = glean.agents.create_run(agent_id="<id>", messages=[
                    {
                        "role": models.PlatformMessageRole.USER,
                        "content": [],
                    },
                ], stream=False)

                # Handle response
                print(res)
        - lang: JavaScript
          label: Typescript (API Client)
          source: |-
            import { Glean } from "@gleanwork/api-client";

            const glean = new Glean({
              apiToken: process.env["GLEAN_API_TOKEN"] ?? "",
              serverURL: "https://mycompany-be.glean.com",
            });

            async function run() {
              const result = await glean.agents.createRun({
                messages: [
                  {
                    role: "USER",
                    content: [],
                  },
                ],
              }, "<id>");

              console.log(result);
            }

            run();
        - lang: Go
          label: Go (API Client)
          source: "package main\n\nimport(\n\t\"context\"\n\t\"os\"\n\tapiclientgo \"github.com/gleanwork/api-client-go\"\n\t\"github.com/gleanwork/api-client-go/models/components\"\n\t\"log\"\n)\n\nfunc main() {\n    ctx := context.Background()\n\n    s := apiclientgo.New(\n        apiclientgo.WithSecurity(os.Getenv(\"GLEAN_API_TOKEN\")),\n        apiclientgo.WithServerURL(\"https://mycompany-be.glean.com\"),\n    )\n\n    res, err := s.Agents.CreateRun(ctx, \"<id>\", components.PlatformAgentRunCreateRequest{\n        Messages: []components.PlatformMessage{\n            components.PlatformMessage{\n                Role: components.PlatformMessageRoleUser,\n                Content: []components.PlatformMessageTextBlock{},\n            },\n        },\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n    if res.PlatformAgentRunWaitResponse != nil {\n        // handle response\n    }\n}"
        - lang: Java
          label: Java (API Client)
          source: |-
            package hello.world;

            import com.glean.api_client.glean_api_client.Glean;
            import com.glean.api_client.glean_api_client.models.components.*;
            import com.glean.api_client.glean_api_client.models.errors.PlatformProblemDetailException;
            import com.glean.api_client.glean_api_client.models.errors.PlatformUnauthorizedAgentToolsProblemException;
            import com.glean.api_client.glean_api_client.models.operations.PlatformAgentsCreateRunResponse;
            import java.lang.Exception;
            import java.util.List;

            public class Application {

                public static void main(String[] args) throws PlatformUnauthorizedAgentToolsProblemException, PlatformProblemDetailException, Exception {

                    Glean sdk = Glean.builder()
                            .apiToken(System.getenv().getOrDefault("GLEAN_API_TOKEN", ""))
                        .build();

                    PlatformAgentsCreateRunResponse res = sdk.agents().createRun()
                            .agentId("<id>")
                            .platformAgentRunCreateRequest(PlatformAgentRunCreateRequest.builder()
                                .messages(List.of(
                                    PlatformMessage.builder()
                                        .role(PlatformMessageRole.USER)
                                        .content(List.of())
                                        .build()))
                                .build())
                            .call();

                    if (res.platformAgentRunWaitResponse().isPresent()) {
                        System.out.println(res.platformAgentRunWaitResponse().get());
                    }
                }
            }
  /api/chat:
    post:
      tags:
        - Chat
      summary: Create a chat response
      description: |
        Run an assistant turn. Set `stream` to true to receive server-sent events; otherwise the response is a typed JSON response object.
      operationId: platform-chat-create
      x-visibility: Public
      x-glean-experimental:
        id: e65a0a77-97a2-4c91-be60-eae7f6238015
        introduced: '2026-07-14'
      x-codegen-request-body-name: payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformChatCreateRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformChatCompletedResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent events for a streaming chat run. Event payloads are documented under ChatStream* schemas.
                example: |
                  id: 1
                  event: RESPONSE_CREATED
                  data: {"type":"RESPONSE_CREATED","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015"}

                  id: 2
                  event: RESPONSE_PROGRESS
                  data: {"type":"RESPONSE_PROGRESS","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015","text":"**Searching:** foo"}

                  id: 3
                  event: RESPONSE_OUTPUT_TEXT_DELTA
                  data: {"type":"RESPONSE_OUTPUT_TEXT_DELTA","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015","delta":"Hello"}

                  id: 4
                  event: RESPONSE_OUTPUT_TEXT_DONE
                  data: {"type":"RESPONSE_OUTPUT_TEXT_DONE","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015","text":"Hello"}

                  id: 5
                  event: RESPONSE_COMPLETED
                  data: {"type":"RESPONSE_COMPLETED","response_id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015","response":{"id":"resp_e65a0a77-97a2-4c91-be60-eae7f6238015","object":"RESPONSE","status":"COMPLETED","output":[{"type":"MESSAGE","role":"ASSISTANT","content":[{"type":"OUTPUT_TEXT","text":"Hello"}]}],"store":true,"request_id":"req_123","created_at":"2026-07-14T20:00:00Z"}}
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformUnauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '408':
          $ref: '#/components/responses/PlatformRequestTimeout'
        '413':
          $ref: '#/components/responses/PlatformRequestTooLarge'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '429':
          $ref: '#/components/responses/PlatformTooManyRequests'
        '500':
          $ref: '#/components/responses/PlatformInternalServerError'
        '503':
          $ref: '#/components/responses/PlatformServiceUnavailable'
      x-speakeasy-group: chat
      x-speakeasy-name-override: create
      x-codeSamples:
        - lang: Python
          label: Python (API Client)
          source: |-
