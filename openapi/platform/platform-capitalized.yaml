            application/problem+json:
              schema:
                $ref: '#/components/schemas/PlatformUnauthorizedAgentToolsProblem'
        '429':
          $ref: '#/components/responses/PlatformTooManyRequests'
        '500':
          $ref: '#/components/responses/PlatformInternalServerError'
        '503':
          $ref: '#/components/responses/PlatformServiceUnavailable'
      x-speakeasy-group: skills
      x-speakeasy-name-override: previewSourceStream
      x-codeSamples:
        - lang: Python
          label: Python (API Client)
          source: |-
            from glean.api_client import Glean
            import os


            with Glean(
                api_token=os.getenv("GLEAN_API_TOKEN", ""),
                server_url="https://mycompany-be.glean.com",
            ) as glean:

                res = glean.skills.preview_source_stream(source_url="https://github.com/anthropics/skills")

                with res as event_stream:
                    for event in event_stream:
                        # handle event
                        print(event, flush=True)
        - lang: JavaScript
          label: Typescript (API Client)
          source: |-
            import { Glean } from "@gleanwork/api-client";

            const glean = new Glean({
              apiToken: process.env["GLEAN_API_TOKEN"] ?? "",
              serverURL: "https://mycompany-be.glean.com",
            });

            async function run() {
              const result = await glean.skills.previewSourceStream({
                source_url: "https://github.com/anthropics/skills",
              });

              for await (const event of result) {
                console.log(event);
              }
            }

            run();
        - lang: Go
          label: Go (API Client)
          source: "package main\n\nimport(\n\t\"context\"\n\t\"os\"\n\tapiclientgo \"github.com/gleanwork/api-client-go\"\n\t\"github.com/gleanwork/api-client-go/models/operations\"\n\t\"log\"\n)\n\nfunc main() {\n    ctx := context.Background()\n\n    s := apiclientgo.New(\n        apiclientgo.WithSecurity(os.Getenv(\"GLEAN_API_TOKEN\")),\n        apiclientgo.WithServerURL(\"https://mycompany-be.glean.com\"),\n    )\n\n    res, err := s.Skills.PreviewSourceStream(ctx, operations.PlatformSkillsPreviewSourceStreamRequest{\n        SourceURL: \"https://github.com/anthropics/skills\",\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n    if res.PlatformSkillSourcePreviewStreamEventServerSentEvent != nil {\n        defer res.PlatformSkillSourcePreviewStreamEventServerSentEvent.Close()\n\n        for res.PlatformSkillSourcePreviewStreamEventServerSentEvent.Next() {\n            event := res.PlatformSkillSourcePreviewStreamEventServerSentEvent.Value()\n            log.Print(event)\n            // Handle the event\n\t      }\n    }\n}"
        - lang: Java
          label: Java (API Client)
          source: |-
            package hello.world;

            import com.glean.api_client.glean_api_client.Glean;
            import com.glean.api_client.glean_api_client.models.components.PlatformSkillSourcePreviewStreamEventServerSentEvent;
            import com.glean.api_client.glean_api_client.models.errors.PlatformProblemDetailException;
            import com.glean.api_client.glean_api_client.models.errors.PlatformUnauthorizedAgentToolsProblemException;
            import com.glean.api_client.glean_api_client.models.operations.PlatformSkillsPreviewSourceStreamRequest;
            import com.glean.api_client.glean_api_client.models.operations.PlatformSkillsPreviewSourceStreamResponse;
            import com.glean.api_client.glean_api_client.utils.EventStream;
            import java.lang.Exception;
            import java.util.stream.Stream;

            public class Application {

                public static void main(String[] args) throws PlatformUnauthorizedAgentToolsProblemException, PlatformProblemDetailException, Exception {

                    Glean sdk = Glean.builder()
                            .apiToken(System.getenv().getOrDefault("GLEAN_API_TOKEN", ""))
                        .build();

                    PlatformSkillsPreviewSourceStreamRequest req = PlatformSkillsPreviewSourceStreamRequest.builder()
                            .sourceUrl("https://github.com/anthropics/skills")
                            .build();

                    PlatformSkillsPreviewSourceStreamResponse res = sdk.skills().previewSourceStream()
                            .request(req)
                            .call();

                    // handle event stream, must be closed after use!
                    try (EventStream<PlatformSkillSourcePreviewStreamEventServerSentEvent> events = res.events()) {
                        // Option 1: Use for-each loop
                        for (PlatformSkillSourcePreviewStreamEventServerSentEvent event : events) {
                            System.out.println(event);
                        }

                        // Option 2: Use Stream API
                        try (Stream<PlatformSkillSourcePreviewStreamEventServerSentEvent> stream = events.stream()) {
                             stream.forEach(System.out::println);
                        }
                    }
                }
            }
