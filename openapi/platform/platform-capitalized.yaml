                    description: Detect an approval amount.
                  - required:
                      - scope
                    description: Detect an approval scope.
                  - required:
                      - resolution_target
                    description: Detect an approval target.
                  - required:
                      - resolution_target_id
                    description: Detect an approval target identifier.
