    PlatformEvaluatedLimit:
      type: object
      additionalProperties: false
      description: Evaluation details for one independently applicable usage limit.
      required:
        - target
        - usage_selector
        - value
        - used
        - decision
      properties:
        target:
          $ref: '#/components/schemas/PlatformUsagePolicySourceTarget'
          description: |
            Configured source of this limit. Default and group policies retain their source population; used is the concrete evaluated user's or agent's counter. IdP-group identities require billing-read permission, but all callers receive the complete limit value, counter, decision, and headroom.
        usage_selector:
          $ref: '#/components/schemas/PlatformUsageSelector'
          description: |
            Actual scope of this rule's counter. Client rules identify their client; aggregate agent rules omit client_id even when evaluation selects a client.
        value:
          $ref: '#/components/schemas/PlatformUsageLimitValue'
          description: Configured cap before approved one-period grants; value.amount is not remaining headroom.
        used:
          type: string
          description: Decimal amount of accrued usage for this limit.
        decision:
          $ref: '#/components/schemas/PlatformUsageLimitDecision'
          description: Decision for this limit.
    PlatformEvaluateUsageLimitResponse:
      type: object
      additionalProperties: false
      description: |
        Configured-budget evaluation for a concrete target and selector, not runtime admission, model eligibility, or agent-run preflight. AVAILABLE can mean that no configured policy applies; inspect applicable_policy_count and the exact selector echo. Configured caps are evaluated_limits[].value.amount, accrued usage is evaluated_limits[].used, and remaining budget is effective_limits[].remaining. Approved one-period grants raise headroom without changing the configured cap. Units are never combined or converted.
      example:
        target:
          type: USER
          user_id: user-123
        usage_selector:
          client_id: glean
          period:
            type: RECURRING_CALENDAR_MONTH
        applicable_policy_count: 1
        decision: AVAILABLE
        effective_limits:
          - mode: FINITE
            remaining: '60'
            unit: USD
            enforcement: HARD
        evaluated_limits:
          - target:
              type: DEFAULT_USER
            usage_selector:
              client_id: glean
              period:
                type: RECURRING_CALENDAR_MONTH
            value:
              mode: FINITE
              amount: '80'
              unit: USD
              enforcement: HARD
            used: '20'
            decision: AVAILABLE
        evaluated_at: '2026-10-06T18:48:16Z'
        request_id: example-request
      required:
        - target
        - usage_selector
        - applicable_policy_count
        - decision
        - effective_limits
        - evaluated_limits
        - evaluated_at
        - request_id
      properties:
        target:
          $ref: '#/components/schemas/PlatformUsageTarget'
          description: |
            Normalized concrete ORGANIZATION, USER, or AGENT evaluated. USER targets contain the canonical user_id, not the supplied alias ID or email. Included even when no configured policies apply.
        usage_selector:
          $ref: '#/components/schemas/PlatformUsageSelector'
          description: Exact evaluated selector, including case and padding of client_id; never normalized.
        applicable_policy_count:
          type: integer
          minimum: 0
          description: |
            Number of applicable configured policies, including UNLIMITED policies. Zero explicitly means no configured policy matched, not an unlimited configured rule. Included even when zero.
        decision:
          $ref: '#/components/schemas/PlatformUsageLimitDecision'
          description: Overall configured-budget status across all evaluated limits, not runtime admission.
        effective_limits:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/PlatformUsageHeadroomValue'
          description: |
            Tightest remaining budget per finite unit, ordered USD then CREDITS. remaining is headroom after accrued usage and approved one-period grants, not a configured cap. Units are never combined or converted. When no finite policy applies, contains a single UNLIMITED entry without remaining, unit, or enforcement, including when applicable_policy_count is zero. This configured-budget result is not a runtime admission guarantee.
        evaluated_limits:
          type: array
          items:
            $ref: '#/components/schemas/PlatformEvaluatedLimit'
          description: Per-rule evaluation details.
        evaluated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when usage counters were read.
        request_id:
          type: string
          description: Request identifier for correlating this response.
    PlatformEvaluateCallerUsageLimitRequest:
      type: object
      additionalProperties: false
      description: |
        Non-admin evaluation request. Only omission of target selects the authenticated canonical user; null, empty, and incomplete targets are invalid. Explicit USER targets accept the caller's canonical ID, known alias IDs, email, or known alias emails; every supplied field must identify the caller. AGENT targets require current edit permission and evaluate aggregate agent usage, including organization limits. The authenticated identity is never replaced by the selected target.
      required:
