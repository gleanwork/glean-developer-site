      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformTriggerCreateRequest'
      callbacks:
        triggerEvent:
          '{$request.body#/delivery/webhook_url}':
            post:
              tags:
                - Triggers
              summary: Receive a trigger event
              description: Delivery uses at-least-once semantics, so the same event can be sent more than once. Return any 2xx status after accepting the event. Network failures, 408, 429, and 5xx responses are retried; other non-2xx responses, including redirects, are terminal. The `webhook-id` remains stable across attempts and can be used for deduplication, while `webhook-timestamp` and `webhook-signature` are generated for each attempt.
              operationId: trigger-webhook-event
              security:
                - {}
                - TriggerWebhookBearerAuth: []
              parameters:
                - $ref: '#/components/parameters/TriggerWebhookId'
                - $ref: '#/components/parameters/TriggerWebhookTimestamp'
                - $ref: '#/components/parameters/TriggerWebhookSignature'
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/PlatformTriggerWebhookEvent'
              responses:
                '408':
                  description: Request timeout. Glean retries the delivery.
                '429':
                  description: Rate limited. Glean retries the delivery.
                2XX:
                  description: Event accepted. Glean does not retry the delivery.
                3XX:
                  description: Redirects are not followed and the delivery is not retried.
                4XX:
                  description: Client error other than 408 or 429. Glean does not retry.
                5XX:
                  description: Server error. Glean retries the delivery.
      responses:
        '201':
          description: Trigger created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTriggerCreateResponse'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
