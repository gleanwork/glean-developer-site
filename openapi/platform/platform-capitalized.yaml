  /api/agents/{agent_id}/runs:
    post:
      tags:
        - Agents
      summary: Create agent run
      description: |
        Execute an agent run. By default, set `stream` to true to receive server-sent events; otherwise the response contains the final agent messages. Set `execution_mode` to `DURABLE` to persist a new run and return its initial snapshot with HTTP 201 without waiting for execution. Poll the agent-scoped GET run endpoint for progress. Durable execution continues after an HTTP disconnect, but is not automatically resumed after a QE restart or crash. An active turn becomes overdue more than 40 minutes after acceptance (a 30-minute execution timeout plus 10 minutes of grace). The next GET of the run marks the overdue turn FAILED without replay; there is no periodic sweep. Without a GET, the stored run can remain RUNNING. Failure does not prove that external tool work has stopped. Paused runs are not expired; an accepted approval continuation starts a fresh deadline. Each POST creates a new run; retrying a POST can create another execution. Submit pending approval decisions through the run responses endpoint, and cancellation can be requested through the run cancellations endpoint. A run tracks one workflow execution; automatic background-subagent wake turns are separate executions, not continuations tracked by this run ID.
      operationId: platform-agents-create-run
      x-glean-scopes:
        legacy:
          - AGENTS
        platform:
          - agents:run
      x-visibility: Public
      x-codegen-request-body-name: payload
      parameters:
        - in: path
          name: agent_id
          description: ID of the agent to run.
          required: true
          example: '{agent_id}'
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAgentRunCreateRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAgentRunWaitResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent events emitted by the running agent. Successful runs emit `message` events. A terminal failure after the stream has started emits exactly one `run.failed` event whose `data` is an `AgentRunFailedEventData` payload, then closes.
                example: |
                  id: 1
                  event: message
                  data: {"messages":[{"role":"GLEAN_AI","content":[{"text":"Hello","type":"text"}]}]}
                  id: 2
                  event: message
                  data: {"messages":[{"role":"GLEAN_AI","content":[{"text":", I can help with HR policy questions.","type":"text"}]}]}

                  id: 3
                  event: run.failed
                  data: {"error":{"type":"https://developers.glean.com/errors/spend-limit-exceeded","title":"Spend Limit Exceeded","status":403,"detail":"You've reached the monthly limit set by your admin.","code":"spend_limit_exceeded","request_id":"req_123","documentation_url":"https://developers.glean.com/errors/spend-limit-exceeded"}}
        '201':
          description: |
            Durable run persisted and started. The snapshot is immediately retrievable through GET /api/agents/{agent_id}/runs/{run_id}. Execution failures appear in the run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAgentRunResponse'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformUnauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '408':
          $ref: '#/components/responses/PlatformRequestTimeout'
        '409':
          $ref: '#/components/responses/PlatformConflict'
        '413':
          $ref: '#/components/responses/PlatformRequestTooLarge'
        '422':
          description: Returned when the agent has tools the caller must authorize before the run can start. `authentication_suggestions` names each such tool; POST its `server_id` to the Client API's `/tool-servers/{serverId}/auth` with `returnUrl` in the request body to obtain an `authorizationUrl` to redirect the end user to, then retry the run once OAuth completes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PlatformUnauthorizedAgentToolsProblem'
        '429':
          $ref: '#/components/responses/PlatformTooManyRequests'
        '500':
          $ref: '#/components/responses/PlatformInternalServerError'
        '503':
          $ref: '#/components/responses/PlatformServiceUnavailable'
      x-speakeasy-group: agents
      x-speakeasy-name-override: createRun
      x-codeSamples:
        - lang: Python
          label: Python (API Client)
          source: |-
            from glean.api_client import Glean, models
            import os


            with Glean(
                api_token=os.getenv("GLEAN_API_TOKEN", ""),
                server_url="https://mycompany-be.glean.com",
            ) as glean:

                res = glean.agents.create_run(agent_id="{agent_id}", messages=[
                    {
                        "role": models.PlatformMessageRole.USER,
                        "content": [
                            {
                                "text": "What is our parental leave policy?",
                                "type": models.PlatformContentType.TEXT,
                            },
                        ],
                    },
                ], stream=False, execution_mode=models.ExecutionMode.REQUEST_BOUND)

                # Handle response
                print(res)
        - lang: JavaScript
          label: Typescript (API Client)
          source: |-
            import { Glean } from "@gleanwork/api-client";

            const glean = new Glean({
              apiToken: process.env["GLEAN_API_TOKEN"] ?? "",
              serverURL: "https://mycompany-be.glean.com",
            });

            async function run() {
              const result = await glean.agents.createRun({
                messages: [
                  {
                    role: "USER",
                    content: [
                      {
                        text: "What is our parental leave policy?",
                        type: "text",
                      },
                    ],
                  },
                ],
              }, "{agent_id}");

              console.log(result);
            }

            run();
        - lang: Go
          label: Go (API Client)
          source: "package main\n\nimport(\n\t\"context\"\n\t\"os\"\n\tapiclientgo \"github.com/gleanwork/api-client-go\"\n\t\"github.com/gleanwork/api-client-go/models/components\"\n\t\"log\"\n)\n\nfunc main() {\n    ctx := context.Background()\n\n    s := apiclientgo.New(\n        apiclientgo.WithSecurity(os.Getenv(\"GLEAN_API_TOKEN\")),\n        apiclientgo.WithServerURL(\"https://mycompany-be.glean.com\"),\n    )\n\n    res, err := s.Agents.CreateRun(ctx, \"{agent_id}\", components.PlatformAgentRunCreateRequest{\n        Messages: []components.PlatformMessageInput{\n            components.PlatformMessageInput{\n                Role: components.PlatformMessageRoleUser,\n                Content: []components.PlatformMessageTextBlockInput{\n                    components.PlatformMessageTextBlockInput{\n                        Text: \"What is our parental leave policy?\",\n                        Type: components.PlatformContentTypeText,\n                    },\n                },\n            },\n        },\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n    if res.PlatformAgentRunWaitResponse != nil {\n        // handle response\n    }\n}"
        - lang: Java
          label: Java (API Client)
          source: |-
            package hello.world;

            import com.glean.api_client.glean_api_client.Glean;
            import com.glean.api_client.glean_api_client.models.components.*;
            import com.glean.api_client.glean_api_client.models.errors.PlatformProblemDetailException;
            import com.glean.api_client.glean_api_client.models.errors.PlatformUnauthorizedAgentToolsProblemException;
            import com.glean.api_client.glean_api_client.models.operations.PlatformAgentsCreateRunResponse;
            import java.lang.Exception;
            import java.util.List;

            public class Application {

                public static void main(String[] args) throws PlatformUnauthorizedAgentToolsProblemException, PlatformProblemDetailException, Exception {

                    Glean sdk = Glean.builder()
                            .apiToken(System.getenv().getOrDefault("GLEAN_API_TOKEN", ""))
                        .build();

                    PlatformAgentsCreateRunResponse res = sdk.agents().createRun()
                            .agentId("{agent_id}")
                            .platformAgentRunCreateRequest(PlatformAgentRunCreateRequest.builder()
                                .messages(List.of(
                                    PlatformMessageInput.builder()
                                        .role(PlatformMessageRole.USER)
                                        .content(List.of(
                                            PlatformMessageTextBlockInput.builder()
                                                .text("What is our parental leave policy?")
                                                .type(PlatformContentType.TEXT)
                                                .build()))
                                        .build()))
                                .build())
                            .call();

                    if (res.platformAgentRunWaitResponse().isPresent()) {
                        System.out.println(res.platformAgentRunWaitResponse().get());
                    }
                }
            }
  /api/agents/{agent_id}/runs/{run_id}:
    get:
      tags:
        - Agents
      summary: Get agent run
      description: |
        Retrieve a persisted workflow execution owned by the authenticated user. The run must belong to the specified agent, and the user must still have access to that agent. Unknown runs, runs owned by another user, and mismatched agent/run identifiers return 404. Requires the agents.run scope. Executions without a persisted workflow record are not available through this endpoint.
      operationId: platform-agents-get-run
      x-glean-scopes:
        legacy:
          - AGENTS
        platform:
          - agents:run
      x-visibility: Public
      parameters:
        - in: path
          name: agent_id
          description: ID of the agent that owns the run.
          required: true
          example: '{agent_id}'
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - in: path
          name: run_id
          description: ID of the durable run to retrieve.
          required: true
          example: '{run_id}'
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: Current persisted run snapshot. A failed execution is still a successful retrieval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAgentRunResponse'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformUnauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '408':
