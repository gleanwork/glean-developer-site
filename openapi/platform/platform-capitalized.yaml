        - lang: Go
          label: Go (API Client)
          source: "package main\n\nimport(\n\t\"context\"\n\t\"os\"\n\tapiclientgo \"github.com/gleanwork/api-client-go\"\n\t\"github.com/gleanwork/api-client-go/models/operations\"\n\t\"github.com/gleanwork/api-client-go/models/components\"\n\t\"log\"\n)\n\nfunc main() {\n    ctx := context.Background()\n\n    s := apiclientgo.New(\n        apiclientgo.WithSecurity(os.Getenv(\"GLEAN_API_TOKEN\")),\n        apiclientgo.WithServerURL(\"https://mycompany-be.glean.com\"),\n    )\n\n    res, err := s.Chat.CreateStream(ctx, operations.PlatformChatCreateStreamRequest{\n        Input: operations.CreatePlatformChatCreateStreamInputStr(\n            \"Summarize our parental leave policy as JSON.\",\n        ),\n        Text: &operations.PlatformChatCreateStreamText{\n            Format: apiclientgo.Pointer(operations.CreatePlatformChatCreateStreamFormatPlatformChatJSONSchemaFormat(\n                components.PlatformChatJSONSchemaFormat{\n                    Type: components.PlatformChatJSONSchemaFormatTypeJSONSchema,\n                    Name: \"policy_summary\",\n                    Schema: map[string]any{\n                        \"type\": \"object\",\n                        \"properties\": map[string]any{\n                            \"eligible_employees\": map[string]any{\n                                \"type\": \"string\",\n                            },\n                            \"duration_weeks\": map[string]any{\n                                \"type\": \"integer\",\n                            },\n                        },\n                        \"required\": []any{\n                            \"eligible_employees\",\n                            \"duration_weeks\",\n                        },\n                    },\n                },\n            )),\n        },\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n    if res.PlatformChatStreamEventServerSentEvent != nil {\n        defer res.PlatformChatStreamEventServerSentEvent.Close()\n\n        for res.PlatformChatStreamEventServerSentEvent.Next() {\n            event := res.PlatformChatStreamEventServerSentEvent.Value()\n            log.Print(event)\n            // Handle the event\n\t      }\n    }\n}"
        - lang: Java
          label: Java (API Client)
          source: |-
            package hello.world;

            import com.glean.api_client.glean_api_client.Glean;
            import com.glean.api_client.glean_api_client.models.components.*;
            import com.glean.api_client.glean_api_client.models.errors.PlatformProblemDetailException;
            import com.glean.api_client.glean_api_client.models.operations.*;
            import com.glean.api_client.glean_api_client.utils.EventStream;
            import java.lang.Exception;
            import java.util.List;
            import java.util.Map;
            import java.util.stream.Stream;

            public class Application {

                public static void main(String[] args) throws PlatformProblemDetailException, Exception {

                    Glean sdk = Glean.builder()
                            .apiToken(System.getenv().getOrDefault("GLEAN_API_TOKEN", ""))
                        .build();

                    PlatformChatCreateStreamRequest req = PlatformChatCreateStreamRequest.builder()
                            .input(PlatformChatCreateStreamInput.of("Summarize our parental leave policy as JSON."))
                            .text(PlatformChatCreateStreamText.builder()
                                .format(PlatformChatCreateStreamFormat.of(PlatformChatJsonSchemaFormat.builder()
                                    .type(PlatformChatJsonSchemaFormatType.JSON_SCHEMA)
                                    .name("policy_summary")
                                    .schema(Map.ofEntries(
                                        Map.entry("type", "object"),
                                        Map.entry("properties", Map.ofEntries(
                                            Map.entry("eligible_employees", Map.ofEntries(
                                                Map.entry("type", "string"))),
                                            Map.entry("duration_weeks", Map.ofEntries(
                                                Map.entry("type", "integer"))))),
                                        Map.entry("required", List.of(
                                            "eligible_employees",
                                            "duration_weeks"))))
                                    .build()))
                                .build())
                            .build();

                    PlatformChatCreateStreamResponse res = sdk.chat().createStream()
                            .request(req)
                            .call();

                    // handle event stream, must be closed after use!
                    try (EventStream<PlatformChatStreamEventServerSentEvent> events = res.events()) {
                        // Option 1: Use for-each loop
                        for (PlatformChatStreamEventServerSentEvent event : events) {
                            System.out.println(event);
                        }

                        // Option 2: Use Stream API
                        try (Stream<PlatformChatStreamEventServerSentEvent> stream = events.stream()) {
                             stream.forEach(System.out::println);
                        }
                    }
                }
            }
