      tags:
        - Departments
      summary: List departments
      description: |
        List the departments in the Glean directory, ordered by display_name and then by department_id. A department is active when at least one active user belongs to it. A department is inactive when only inactive users, such as former employees, belong to it, or when only a usage limit names it. Inactive departments are left out unless an is_active filter includes the value "false". Department names are exact, so names that differ only by case are different departments.
      operationId: platform-departments-list
      x-glean-scopes:
        legacy:
          - PEOPLE
        platform:
          - departments:read
      x-visibility: Public
      x-glean-experimental:
        id: 2bc9ce31-8e51-4874-996c-96ad2e10fbd7
        introduced: '2026-10-08'
      parameters:
        - in: header
          name: X-Glean-Include-Experimental
          description: This endpoint is experimental, so requests must include this header set to `true`. See [How experimental APIs work](https://developers.glean.com/experimental/overview) for details.
          required: true
          schema:
            type: boolean
            default: true
          example: true
          value: 'true'
        - in: query
          name: page_size
          description: Maximum number of departments to return. Defaults to 50. Maximum is 100.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          description: |
            Opaque pagination cursor from a previous response. Send the same filters that the previous request used.
          required: false
          schema:
            type: string
            minLength: 1
        - in: query
          name: filters
          description: |
            JSON-encoded filters that choose which departments are returned. The only supported field is is_active, with the values "true" and "false" and the operator EQUALS. Multiple values OR within a filter. Multiple filters AND together. Without an is_active filter, only active departments are returned. To return active and inactive departments, send [{"field":"is_active","values":["true","false"]}].
          required: false
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 10
                description: Filters on department fields, combined with AND.
                items:
                  $ref: '#/components/schemas/PlatformDepartmentFilter'
                  description: One filter on a department field.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformListDepartmentsResponse'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformUnauthorized'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '408':
          $ref: '#/components/responses/PlatformRequestTimeout'
        '429':
          $ref: '#/components/responses/PlatformTooManyRequests'
        '500':
          $ref: '#/components/responses/PlatformInternalServerError'
        '503':
          $ref: '#/components/responses/PlatformServiceUnavailable'
      x-speakeasy-group: departments
      x-speakeasy-name-override: list
      x-codeSamples:
        - lang: Python
          label: Python (API Client)
          source: |-
            from glean.api_client import Glean
            import os


            with Glean(
                api_token=os.getenv("GLEAN_API_TOKEN", ""),
                server_url="https://mycompany-be.glean.com",
                include_experimental=True,
            ) as glean:

                res = glean.departments.list(page_size=50)

                # Handle response
                print(res)
        - lang: JavaScript
          label: Typescript (API Client)
          source: |-
            import { Glean } from "@gleanwork/api-client";

            const glean = new Glean({
              apiToken: process.env["GLEAN_API_TOKEN"] ?? "",
              serverURL: "https://mycompany-be.glean.com",
