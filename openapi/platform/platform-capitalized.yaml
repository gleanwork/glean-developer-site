  /api/admin/agents:
    get:
      tags:
        - Admin Agents
      summary: List all agents
      description: |
        List every agent in the workspace, ordered by display_name and then by agent_id. Unlike agent search, the list does not depend on who an agent is shared with, so it includes private and disabled agents. Deleted agents are inactive and are left out unless an is_active filter includes the value "false". Use the agent_id of an active agent with other Platform APIs, for example as a usage limit target. A deleted agent is not a valid usage limit target. The caller must be able to read all agents, administer agents, or read workspace billing.
      operationId: platform-admin-agents-list
      x-glean-scopes:
        legacy:
          - ADMIN
          - ADMIN_USAGE
        platform:
          - admin.agents:read
      x-visibility: Public
      x-glean-experimental:
        id: 8f66e1bd-eb48-4381-88f2-697a0e51ccc7
        introduced: '2026-10-08'
      parameters:
        - in: header
          name: X-Glean-Include-Experimental
          description: This endpoint is experimental, so requests must include this header set to `true`. See [How experimental APIs work](https://developers.glean.com/experimental/overview) for details.
          required: true
          schema:
            type: boolean
            default: true
          example: true
          value: 'true'
        - in: query
          name: page_size
          description: Maximum number of agents to return. Defaults to 50. Maximum is 100.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          description: |
            Opaque pagination cursor from a previous response. Send the same filters that the previous request used.
          required: false
          schema:
            type: string
            minLength: 1
        - in: query
          name: filters
          description: |
            JSON-encoded filters that choose which agents are returned. The only supported field is is_active, with the values "true" and "false" and the operator EQUALS. Multiple values OR within a filter. Multiple filters AND together. Without an is_active filter, only active agents are returned. To return active and deleted agents, send [{"field":"is_active","values":["true","false"]}].
          required: false
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 10
                description: Filters on agent fields, combined with AND.
                items:
                  $ref: '#/components/schemas/PlatformAdminAgentFilter'
                  description: One filter on an agent field.
      responses:
