        - lang: Go
          label: Go (API Client)
          source: "package main\n\nimport(\n\t\"context\"\n\t\"os\"\n\tapiclientgo \"github.com/gleanwork/api-client-go\"\n\t\"github.com/gleanwork/api-client-go/models/components\"\n\t\"log\"\n)\n\nfunc main() {\n    ctx := context.Background()\n\n    s := apiclientgo.New(\n        apiclientgo.WithSecurity(os.Getenv(\"GLEAN_API_TOKEN\")),\n        apiclientgo.WithServerURL(\"https://mycompany-be.glean.com\"),\n        apiclientgo.WithIncludeExperimental(true),\n    )\n\n    res, err := s.Chat.Create(ctx, components.PlatformChatCreateRequest{\n        Input: components.CreateInputStr(\n            \"<value>\",\n        ),\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n    if res.PlatformChatCompletedResponse != nil {\n        // handle response\n    }\n}"
        - lang: Java
          label: Java (API Client)
          source: |-
            package hello.world;

            import com.glean.api_client.glean_api_client.Glean;
            import com.glean.api_client.glean_api_client.hooks.GleanBuilder;
            import com.glean.api_client.glean_api_client.models.components.Input;
            import com.glean.api_client.glean_api_client.models.components.PlatformChatCreateRequest;
            import com.glean.api_client.glean_api_client.models.errors.PlatformProblemDetailException;
            import com.glean.api_client.glean_api_client.models.operations.PlatformChatCreateResponse;
            import java.lang.Exception;

            public class Application {

                public static void main(String[] args) throws PlatformProblemDetailException, Exception {

                    Glean sdk = GleanBuilder.create()
                            .apiToken(System.getenv().getOrDefault("GLEAN_API_TOKEN", ""))
                            .includeExperimental(true)
                        .build();

                    PlatformChatCreateRequest req = PlatformChatCreateRequest.builder()
