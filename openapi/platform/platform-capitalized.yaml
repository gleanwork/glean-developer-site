        unit:
          $ref: '#/components/schemas/PlatformUsageUnit'
          description: Unit of finite headroom; omitted for unlimited headroom.
        enforcement:
          $ref: '#/components/schemas/PlatformEnforcement'
          description: Enforcement configuration of the tightest finite policy; omitted for unlimited headroom.
      allOf:
        - oneOf:
            - required:
                - remaining
                - unit
                - enforcement
              properties:
                mode:
                  description: Finite remaining headroom.
                  enum:
                    - FINITE
