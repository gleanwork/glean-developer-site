            - properties:
                mode:
                  description: Unlimited remaining headroom.
                  enum:
                    - UNLIMITED
              not:
                anyOf:
                  - required:
                      - remaining
                    properties:
                      remaining:
                        description: Forbidden for unlimited headroom.
                  - required:
                      - unit
                    properties:
                      unit:
                        description: Forbidden for unlimited headroom.
                  - required:
                      - enforcement
                    properties:
                      enforcement:
                        description: Forbidden for unlimited headroom.
