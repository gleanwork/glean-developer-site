      properties:
        target:
          $ref: '#/components/schemas/PlatformUsageTarget'
          description: Optional self or editable agent target. Omit to evaluate self.
        usage_selector:
          $ref: '#/components/schemas/PlatformUsageSelector'
          description: Usage to evaluate for the target; always required.
      allOf:
        - properties:
            usage_selector:
              description: Explicit spend-client context; never inferred from the caller.
              required:
                - client_id
