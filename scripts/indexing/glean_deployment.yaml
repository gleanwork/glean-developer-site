# Project file for the glean-idx CLI (glean-indexing-sdk). It tells
# `glean-idx run`, `glean-idx test`, and `glean-idx datasource configure`
# which connector to load. The connector runs from GitHub Actions
# (.github/workflows/index-developer-docs.yml), not `glean-idx deploy`.
connector_module: developer_docs_connector
connector_class: DeveloperDocsConnector
# The build output has no change feed, so every run is a full crawl.
indexing_mode: full
